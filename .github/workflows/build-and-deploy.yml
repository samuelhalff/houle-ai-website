name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "server.js"
      - "middleware.ts"
      - ".github/workflows/build-and-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "server.js"
      - "middleware.ts"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

# PR builds get their own concurrency group (cancellable) so they never queue
# behind or delay a production deploy; production runs stay serialized and
# uncancellable (killing a run mid-extract/symlink/restart is unsafe).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  actions: read
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Single job, same layout as ridger.ch (proven on this shared host): build,
# upload, extract, then VERIFY. houle.ai's artifact also ships the tenant
# router (dist/server.js) that serves ridger.ch, so a bad release can take
# both sites down: the job only goes green once houle.ai answers with the new
# BUILD_ID and both sites return 200; otherwise `current` is rolled back to the
# previous release (over SFTP, the reliable channel) and the job fails.
# See docs/deploy-ci.md.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript type check
        run: npm run typecheck
        continue-on-error: true

      - name: Check malformed internal markdown links (blocking)
        run: node scripts/fix-article-internal-links.js --check

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      # ─── Deploy (main only) ───

      - name: Install deploy tools
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: command -v sshpass >/dev/null || { sudo apt-get update && sudo apt-get install -y sshpass; }

      - name: Prepare partial artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mkdir -p artifact && cp next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          # Same as ridger.ch: 3 attempts, --partial resumes, --checksum makes
          # a zero exit an end-to-end integrity guarantee.
          for attempt in 1 2 3; do
            if sshpass -p "$PASS" rsync -av --partial --checksum --timeout=60 \
              -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 -p $PORT" \
              artifact/next-standalone.tar.gz.part \
              "$USER@$HOST:/srv/customer/sites/houle.ai/artifact/"; then
              echo "Upload verified on attempt $attempt (rsync checksum)"
              exit 0
            fi
            echo "Upload attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "Upload failed after 3 attempts"
          exit 1

      - name: Sync shared env (secrets -> prod)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORMSPARK_ACTION_URL: ${{ secrets.FORMSPARK_ACTION_URL }}
          RESTART_SECRET_TOKEN: ${{ secrets.RESTART_SECRET_TOKEN }}
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          python - <<'PY'
          import os
          keys = [
            "FORMSPARK_ACTION_URL",
            "RESTART_SECRET_TOKEN",
            "INDEXNOW_SECRET",
          ]
          lines = [
            "PORT=5000",
            "NEXT_PUBLIC_SITE_URL=https://houle.ai",
          ]
          for key in keys:
            value = os.environ.get(key, "")
            if value:
              lines.append(f"{key}={value}")
          with open("env_sync_file", "w") as fh:
            fh.write("\n".join(lines) + "\n")
          print(f"[deploy] env file built with {len(lines)} entries")
          PY

          # SFTP, not ssh-exec: exec channels on this host have failed silently
          # (ContainerSSH wedge, 2026-09-18), leaving secrets out of the runtime
          # env while the step looked green. SFTP is a distinct channel.
          sshpass -p "$PASS" sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" <<'SFTP'
          put env_sync_file /srv/customer/sites/houle.ai/shared/.env
          SFTP
          rm -f env_sync_file
          echo "[deploy] shared/.env written via sftp"

      # ─── Extract, symlink and cleanup (ridger.ch's script + rollback state) ───
      # The router (current/server.js) notices current/.next/BUILD_ID changed and
      # cycles the houle child into the new release by itself (router v6).
      - name: Extract, symlink and cleanup releases
        id: extract
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22
          BASE="/srv/customer/sites/houle.ai"
          BUILD_ID=$(cat dist/.next/BUILD_ID)

          # No separate ssh "probe" session: it proved nothing and every extra
          # session counts against the host's exec throttle.
          if sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 "$USER@$HOST" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/houle.ai"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            STAGE_DIR="$RELEASES_DIR/.staging-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            echo "[deploy] Starting deployment at $(date)" >> "$LOG"
            echo "[deploy] Release timestamp: $TS" >> "$LOG"
            echo "[deploy] Target directory: $REL_DIR" >> "$LOG"

            # Stage inside releases/ (same filesystem): the promotion is one
            # atomic mv and extraction is a single pass.
            mkdir -p "$RELEASES_DIR" "$STAGE_DIR"
            echo "[deploy] Created directories" >> "$LOG"

            [ -f "$PART" ] && mv "$PART" "$ARTIFACT" && echo "[deploy] Moved partial artifact to final location" >> "$LOG"

            echo "[deploy] Extracting artifact..." >> "$LOG"
            # Explicit guards: set -e does not reliably govern an ssh-flattened
            # body, and a truncated artifact must never become a release.
            tar -xzf "$ARTIFACT" --no-same-owner --no-same-permissions -C "$STAGE_DIR" || { echo "[deploy] ERROR: artifact is corrupt or unextractable" >> "$LOG"; rm -rf "$STAGE_DIR"; exit 1; }
            echo "[deploy] Artifact extracted successfully" >> "$LOG"

            # server.js = tenant router, server-app.js = houle Next server.
            for f in server.js server-app.js .next/BUILD_ID .next/static; do
              [ -e "$STAGE_DIR/$f" ] || { echo "[deploy] ERROR: Missing required file: $f" >> "$LOG"; rm -rf "$STAGE_DIR"; exit 1; }
            done
            echo "[deploy] All required files present" >> "$LOG"

            mv "$STAGE_DIR" "$REL_DIR" || { echo "[deploy] ERROR: release promotion failed" >> "$LOG"; rm -rf "$STAGE_DIR"; exit 1; }
            echo "[deploy] Moved to releases directory: $REL_DIR" >> "$LOG"

            mkdir -p "$BASE_DIR/shared"
            if [ -f "$BASE_DIR/shared/.env" ]; then
              ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
              echo "[deploy] Linked .env file" >> "$LOG"
            fi

            # Rollback state, read back by CI over SFTP. Written BEFORE the
            # switch so a switched release always has a recorded predecessor.
            PREV_REL=$(readlink "$CURRENT_LINK" 2>/dev/null || true)
            PREV_BUILD_ID=$(cat "$CURRENT_LINK/.next/BUILD_ID" 2>/dev/null || true)
            NEW_BUILD_ID=$(cat "$REL_DIR/.next/BUILD_ID")
            printf "TS=%s\nNEW_REL=%s\nNEW_BUILD_ID=%s\nPREV_REL=%s\nPREV_BUILD_ID=%s\n" "$TS" "$REL_DIR" "$NEW_BUILD_ID" "$PREV_REL" "$PREV_BUILD_ID" > "$BASE_DIR/deploy_state" || { echo "[deploy] ERROR: could not write deploy_state" >> "$LOG"; exit 1; }
            echo "[deploy] Previous release: ${PREV_REL:-none} (${PREV_BUILD_ID:-?})" >> "$LOG"

            ln -sfn "$REL_DIR" "$CURRENT_LINK"
            echo "$TS" > "$BASE_DIR/last_release_ts"
            echo "[deploy] Updated current symlink to $REL_DIR" >> "$LOG"
            echo "[deploy] Release $TS deployed successfully at $(date)" >> "$LOG"

            # Only directories count as releases (a stray non-directory entry
            # used to be the last loop item, whose failed [ -d ] test made the
            # loop exit 1 under set -e: the 2026-09-25..30 false failures).
            # Never removes the new or the previous (rollback target) release.
            # Cleanup is best-effort: it can no longer fail a live deploy.
            KEEP=4
            cd "$RELEASES_DIR" || exit 0
            ls -1t | while read -r rel; do if [ -d "$rel" ]; then echo "$rel"; fi; done | tail -n +$((KEEP+1)) | while read -r rel; do
              if [ "$rel" != "$TS" ] && [ "$RELEASES_DIR/$rel" != "$PREV_REL" ]; then
                rm -rf "${RELEASES_DIR:?}/$rel" && echo "[deploy] Cleaned up old release: $rel" >> "$LOG"
              fi
            done || echo "[deploy] WARN: release cleanup incomplete" >> "$LOG"
            echo "[deploy] Cleanup completed, keeping last $KEEP releases" >> "$LOG"
          '; then
            RC=0
          else
            RC=$?
          fi
          echo "[deploy] extract session exit code: $RC"

          # ssh exec exit codes on this host are not trustworthy on their own:
          # read the outcome back over SFTP (what current/ points at now).
          for attempt in 1 2 3; do
            rm -f deploy_state disk_build
            sshpass -p "$PASS" sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" >/dev/null <<SFTP || true
          get $BASE/deploy_state deploy_state
          get $BASE/current/.next/BUILD_ID disk_build
          SFTP
            [ -s deploy_state ] && [ -s disk_build ] && break
            echo "[deploy] SFTP read-back attempt $attempt incomplete"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done

          DISK_BUILD=$(tr -d '[:space:]' < disk_build 2>/dev/null || true)
          field() { sed -n "s/^$1=//p" deploy_state 2>/dev/null | head -n1; }
          STATE_BUILD=$(field NEW_BUILD_ID)
          echo "[deploy] expected build $BUILD_ID; current/ on disk: ${DISK_BUILD:-unreadable}"

          if [ -n "$DISK_BUILD" ] && [ "$DISK_BUILD" != "$BUILD_ID" ]; then
            echo "::error::Release was not promoted (current/ is $DISK_BUILD, expected $BUILD_ID; ssh exit $RC). Production unchanged."
            exit 1
          fi
          # Unreadable read-back: do not guess, let the live gate decide.
          [ -n "$DISK_BUILD" ] || echo "::warning::could not read current/ over SFTP; relying on live verification"
          if [ "$STATE_BUILD" = "$BUILD_ID" ]; then
            echo "prev_rel=$(field PREV_REL)" >> "$GITHUB_OUTPUT"
            echo "prev_build_id=$(field PREV_BUILD_ID)" >> "$GITHUB_OUTPUT"
            echo "[deploy] previous release: $(field PREV_REL) ($(field PREV_BUILD_ID))"
          else
            echo "::warning::deploy_state does not match this build; automatic rollback unavailable"
          fi
          [ "$RC" -eq 0 ] || echo "::warning::ssh exec returned $RC but current/ holds the new build; continuing to live verification"

      # ─── Gate: new build live on houle.ai AND both tenants up ───
      - name: Verify release is live (houle.ai + ridger.ch)
        id: verify
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        timeout-minutes: 8
        run: |
          BUILD_ID=$(cat dist/.next/BUILD_ID)
          C=(--connect-timeout 5 --max-time 10 -s)
          build_of() { curl "${C[@]}" "$1/api/health/?d=${GITHUB_RUN_ID}-${RANDOM}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildId",""))' 2>/dev/null || true; }
          code_of() { local c; c=$(curl "${C[@]}" -L -o /dev/null -w '%{http_code}' "$1/" || true); echo "${c:-000}"; }

          # The router cycles houle within ~1 min of the symlink switch. A 200
          # alone proves nothing here (Infomaniak's maintenance page is a 200,
          # and a routing slip serves the other tenant), so houle must report
          # the new BUILD_ID and ridger must answer its own health JSON (a buildId that is not houle's).
          # Two consecutive passes are required.
          PASS_N=0
          for i in $(seq 1 70); do
            HB=$(build_of https://houle.ai); HC=$(code_of https://houle.ai)
            RB=$(build_of https://ridger.ch); RC=$(code_of https://ridger.ch)
            echo "[verify] $i: houle build=${HB:-none} /=$HC | ridger build=${RB:-none} /=$RC"
            if [ "$HB" = "$BUILD_ID" ] && [ "$HC" = "200" ] && [ -n "$RB" ] && [ "$RB" != "$HB" ] && [ "$RC" = "200" ]; then
              PASS_N=$((PASS_N + 1))
              if [ "$PASS_N" -ge 2 ]; then echo "[verify] build $BUILD_ID live; houle.ai and ridger.ch healthy"; exit 0; fi
            else
              PASS_N=0
            fi
            sleep 5
          done
          echo "::error::Build $BUILD_ID not verified live on houle.ai with ridger.ch healthy"
          exit 1

      - name: Roll back to previous release
        if: failure() && steps.verify.outcome == 'failure'
        timeout-minutes: 8
        env:
          PREV_REL: ${{ steps.extract.outputs.prev_rel }}
          PREV_BUILD_ID: ${{ steps.extract.outputs.prev_build_id }}
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22
          BASE="/srv/customer/sites/houle.ai"
          BUILD_ID=$(cat dist/.next/BUILD_ID)

          if ! [[ "$PREV_REL" =~ ^/srv/customer/sites/houle\.ai/releases/[0-9]{14}$ ]] || [ -z "$PREV_BUILD_ID" ] || [ "$PREV_BUILD_ID" = "$BUILD_ID" ]; then
            echo "::error::No usable previous release recorded (rel='$PREV_REL' build='$PREV_BUILD_ID'); roll back manually (see docs/deploy-ci.md)"
            exit 1
          fi

          # Atomic swap over SFTP (posix-rename of a fresh symlink onto
          # current), then read current/.next/BUILD_ID back to prove it.
          DONE=0
          for attempt in 1 2 3; do
            rm -f rb_build
            sshpass -p "$PASS" sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" >/dev/null <<SFTP || true
          -rm $BASE/current.rollback
          symlink $PREV_REL $BASE/current.rollback
          rename $BASE/current.rollback $BASE/current
          get $BASE/current/.next/BUILD_ID rb_build
          SFTP
            if [ "$(tr -d '[:space:]' < rb_build 2>/dev/null)" = "$PREV_BUILD_ID" ]; then DONE=1; break; fi
            echo "[rollback] attempt $attempt not confirmed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          if [ "$DONE" -ne 1 ]; then
            echo "::error::ROLLBACK FAILED: current/ could not be pointed back to $PREV_REL; intervene now"
            exit 1
          fi
          echo "[rollback] current -> $PREV_REL ($PREV_BUILD_ID) on disk; waiting for the router to cycle"

          C=(--connect-timeout 5 --max-time 10 -s)
          for i in $(seq 1 48); do
            HB=$(curl "${C[@]}" "https://houle.ai/api/health/?d=${GITHUB_RUN_ID}-${RANDOM}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildId",""))' 2>/dev/null || true)
            HC=$(curl "${C[@]}" -L -o /dev/null -w '%{http_code}' https://houle.ai/ || true)
            RC=$(curl "${C[@]}" -L -o /dev/null -w '%{http_code}' https://ridger.ch/ || true)
            echo "[rollback] $i: houle build=${HB:-none} /=${HC:-000} | ridger /=${RC:-000}"
            if [ "$HB" != "$BUILD_ID" ] && [ "$HC" = "200" ] && [ "$RC" = "200" ]; then
              echo "::error::Deploy of $BUILD_ID failed verification; rolled back to $PREV_BUILD_ID (sites answering)"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Rolled back on disk to $PREV_BUILD_ID but the sites did not recover within 4 min; check router-status.log"
          exit 1

      - name: Warm up caches (non-blocking)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          CURL_TIMEOUTS=(--connect-timeout 5 --max-time 8)
          for path in "/" "/en/" "/fr/"; do
            curl "${CURL_TIMEOUTS[@]}" -fsSL "https://houle.ai$path" >/dev/null 2>&1 || true
          done
          for locale in en fr; do
            HTML=$(curl "${CURL_TIMEOUTS[@]}" -fsSL "https://houle.ai/$locale/" || true)
            echo "$HTML" | grep -Eo '/_next/image/\?url=[^" ]+' | sed 's/&amp;/\&/g' | head -n 30 | while read -r u; do
              curl "${CURL_TIMEOUTS[@]}" -fsSL "https://houle.ai$u" >/dev/null 2>&1 || true
            done
          done
          echo "[deploy] Warmup done"

      - name: Validate live sitemap (non-blocking)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          curl --connect-timeout 5 --max-time 20 -s "https://houle.ai/sitemap.xml" | head -50
          if curl --connect-timeout 5 --max-time 20 -s "https://houle.ai/sitemap.xml" | grep -q '<loc>https://houle.ai/[a-z][^/]*</loc>'; then
            echo "WARNING: Found sitemap URLs without trailing slashes"
          else
            echo "Sitemap URLs appear to have trailing slashes"
          fi

      # Kept for manual/emergency redeploys; off the critical path.
      - name: Retain deployable artifact
        if: always() && hashFiles('next-standalone.tar.gz') != ''
        uses: actions/upload-artifact@v7
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
