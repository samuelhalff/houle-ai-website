name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "server.js"
      - "middleware.ts"
      - ".github/workflows/build-and-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "server.js"
      - "middleware.ts"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

# PR builds get their own concurrency group (cancellable) so they never queue
# behind or delay a production deploy; production runs stay serialized and
# uncancellable (killing a run mid-extract/symlink/restart is unsafe).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript type check
        run: npm run typecheck
        continue-on-error: true

      - name: Check malformed internal markdown links (blocking)
        run: node scripts/fix-article-internal-links.js --check

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: next-standalone
          path: ./artifact

      - name: Install deploy tools
        run: command -v sshpass >/dev/null || { sudo apt-get update && sudo apt-get install -y sshpass; }

      - name: Prepare partial artifact
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync)
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          sshpass -p "$PASS" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -p $PORT" \
            artifact/next-standalone.tar.gz.part \
            "$USER@$HOST:/srv/customer/sites/houle.ai/artifact/"

      - name: Sync shared env (secrets -> prod)
        env:
          FORMSPARK_ACTION_URL: ${{ secrets.FORMSPARK_ACTION_URL }}
          RESTART_SECRET_TOKEN: ${{ secrets.RESTART_SECRET_TOKEN }}
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          python - <<'PY'
          import os
          keys = [
            "FORMSPARK_ACTION_URL",
            "RESTART_SECRET_TOKEN",
            "INDEXNOW_SECRET",
          ]
          lines = [
            "PORT=5000",
            "NEXT_PUBLIC_SITE_URL=https://houle.ai",
          ]
          for key in keys:
            value = os.environ.get(key, "")
            if value:
              lines.append(f"{key}={value}")
          with open("env_sync_file", "w") as fh:
            fh.write("\n".join(lines) + "\n")
          print(f"[deploy] env file built with {len(lines)} entries")
          PY

          # SFTP, not ssh-exec: exec channels on this host have failed silently
          # (ContainerSSH wedge, 2026-09-18), leaving secrets out of the runtime
          # env while the step looked green. SFTP is a distinct channel.
          sshpass -p "$PASS" sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" <<'SFTP'
          put env_sync_file /srv/customer/sites/houle.ai/shared/.env
          SFTP
          rm -f env_sync_file
          echo "[deploy] shared/.env written via sftp"

      - name: Extract, symlink and cleanup releases
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          echo "[deploy] Testing SSH connectivity to $HOST:$PORT as $USER"
          if sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=10 -p "$PORT" "$USER@$HOST" 'echo "SSH probe successful"' 2>/dev/null; then
            echo "[deploy] SSH probe successful"
          else
            echo "[deploy] SSH probe failed (this may be expected); proceeding with deployment"
          fi

          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$USER@$HOST" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/houle.ai"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP="/tmp/houle-release-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            echo "[deploy] Starting deployment at $(date)" >> "$LOG"
            echo "[deploy] Release timestamp: $TS" >> "$LOG"
            echo "[deploy] Target directory: $REL_DIR" >> "$LOG"

            mkdir -p "$RELEASES_DIR" "$TMP"
            echo "[deploy] Created directories" >> "$LOG"

            [ -f "$PART" ] && mv "$PART" "$ARTIFACT" && echo "[deploy] Moved partial artifact to final location" >> "$LOG"
            cp "$ARTIFACT" "$TMP/artifact.tar.gz"
            echo "[deploy] Copied artifact to temp directory" >> "$LOG"

            echo "[deploy] Extracting artifact..." >> "$LOG"
            gzip -cd "$TMP/artifact.tar.gz" > "$TMP/.payload.tar"
            tar -xf "$TMP/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP"
            rm -f "$TMP/.payload.tar"
            echo "[deploy] Artifact extracted successfully" >> "$LOG"

            for f in server.js .next/BUILD_ID .next/static; do
              [ -e "$TMP/$f" ] || { echo "[deploy] ERROR: Missing required file: $f" >> "$LOG"; exit 1; }
            done
            echo "[deploy] All required files present" >> "$LOG"

            mv "$TMP" "$REL_DIR" || { cp -r "$TMP"/* "$REL_DIR"/ && rm -rf "$TMP"; }
            echo "[deploy] Moved to releases directory: $REL_DIR" >> "$LOG"

            mkdir -p "$BASE_DIR/shared"
            if [ -f "$BASE_DIR/shared/.env" ]; then
              ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
              echo "[deploy] Linked .env file" >> "$LOG"
            fi

            ln -sfn "$REL_DIR" "$CURRENT_LINK"
            echo "$TS" > "$BASE_DIR/last_release_ts"
            echo "[deploy] Updated current symlink to $REL_DIR" >> "$LOG"
            echo "[deploy] Release $TS deployed successfully at $(date)" >> "$LOG"

            KEEP=4
            cd "$RELEASES_DIR" || exit 0
            ls -1t | tail -n +$((KEEP+1)) | while read -r rel; do
              [ -d "$rel" ] && [ "$rel" != "$TS" ] && rm -rf "$RELEASES_DIR/$rel" && echo "[deploy] Cleaned up old release: $rel" >> "$LOG"
            done
            echo "[deploy] Cleanup completed, keeping last $KEEP releases" >> "$LOG"
          '

      - name: Wait for router rolling swap
        # Warn-only: the release is on disk and the router rolls it in
        # (sometimes beyond this window after a respawn). Live/latest drift
        # is watched by the scheduled monitor instead of blocking deploys.
        continue-on-error: true
        timeout-minutes: 6
        run: |
          BUILD_ID=$(cat dist/.next/BUILD_ID 2>/dev/null || echo "")
          # v4 router watches current/.next/BUILD_ID and rolls the tenant to
          # the new build by itself (spawn alt port -> health -> switch).
          # CI only OBSERVES; it never kicks processes (external kill-churn
          # tripped Infomaniak's watchdog into maintenance, 2026-09-18).
          echo "[deploy] waiting for router to roll to build $BUILD_ID"
          OK=0
          for i in $(seq 1 60); do
            LIVE=$(curl -s --max-time 4 "https://houle.ai/api/health/?d=${GITHUB_RUN_ID}-${RANDOM}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildId",""))' 2>/dev/null || true)
            if [ -n "$BUILD_ID" ] && [ "$LIVE" = "$BUILD_ID" ]; then
              echo "[deploy] build $BUILD_ID live (check $i)"; OK=1; break
            fi
            sleep 5
          done
          [ "$OK" -eq 1 ] || { echo "[deploy] router never rolled — check maintenance flag / router logs"; exit 1; }

      - name: Health check and warmup
        timeout-minutes: 5
        run: |
          CURL_TIMEOUTS=(--connect-timeout 5 --max-time 8)
          ATTEMPTS=40; SLEEP=3; OK=0
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(curl "${CURL_TIMEOUTS[@]}" -o /dev/null -s -w "%{http_code}" -L "https://houle.ai/fr/" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check OK"
              OK=1
              break
            fi
            echo "Waiting for server... ($i/$ATTEMPTS, got $STATUS)"
            sleep $SLEEP
          done
          [ "$OK" -eq 1 ] || { echo "Health check failed"; exit 1; }

          echo "[deploy] Warming up paths..."
          for path in "/" "/en/" "/fr/"; do
            curl "${CURL_TIMEOUTS[@]}" -fsSL "https://houle.ai$path" >/dev/null 2>&1 || true
          done

          echo "[deploy] Simple warmup of next/image URLs (non-blocking)"
          for locale in en fr; do
            HTML=$(curl "${CURL_TIMEOUTS[@]}" -fsSL "https://houle.ai/$locale/" || true)
            echo "$HTML" | grep -Eo '/_next/image/\?url=[^" ]+' | sed 's/&amp;/\&/g' | head -n 30 | while read -r u; do
              curl "${CURL_TIMEOUTS[@]}" -fsSL "https://houle.ai$u" >/dev/null 2>&1 || true
            done
          done

          echo "[deploy] Deployment completed successfully"

      - name: Validate live sitemap (non-blocking)
        continue-on-error: true
        run: |
          echo "Checking sitemap format..."
          curl --connect-timeout 5 --max-time 20 -s "https://houle.ai/sitemap.xml" | head -50
          if curl --connect-timeout 5 --max-time 20 -s "https://houle.ai/sitemap.xml" | grep -q '<loc>https://houle.ai/[a-z][^/]*</loc>'; then
            echo "WARNING: Found sitemap URLs without trailing slashes"
          else
            echo "Sitemap URLs appear to have trailing slashes"
          fi
