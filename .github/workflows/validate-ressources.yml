name: Validate Resources (every 3 weeks)

on:
  schedule:
    - cron: "0 6 1,22 * *" # ~every 3 weeks (1st and 22nd of each month)
  workflow_dispatch:

concurrency:
  group: validate-ressources
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate article translations
        env:
          REQUIRE_TRANSLATIONS: "1"
        run: node scripts/validate-article-translations.js

      - name: Clean up bad article references
        run: node scripts/clean-bad-article-refs.js --all-locales

      - name: Check resource links
        run: node scripts/check-ressources-links.js --all-locales --remote

      - name: Commit fixes (if any)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "src/translations/**/*.json" || true
          if git diff --cached --quiet; then
            echo "No fixes to commit"
          else
            git commit -m "chore(ressources): periodic validation cleanup" --author="samuelhalff <660062+samuelhalff@users.noreply.github.com>"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            git push
          fi

      - name: Health check
        continue-on-error: true
        run: |
          echo "🏥 Checking site health..."
          for locale in fr en de es pt; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://houle.ai/${locale}/")
            if [ "$STATUS" = "200" ]; then echo "✅ ${locale}: OK"
            else echo "::warning::❌ ${locale}: HTTP $STATUS"; fi
          done
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://houle.ai/fr/ressources/")
          if [ "$STATUS" = "200" ]; then echo "✅ Resources: OK"
          else echo "::warning::❌ Resources: HTTP $STATUS"; fi
